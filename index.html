    <style>
        :root {

        body {

            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%) !important; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
        }
        .card { 
            border: 1px solid rgba(226, 232, 240, 0.8); 
            border-radius: 16px; 
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04); 
            margin-bottom: 20px; 
            overflow: hidden;
        }
        .staff-only, .admin-only { display: none; } 
        .role-badge { 
            padding: 6px 14px; 
            border-radius: 50px; 
            font-weight: 600; 
            font-size: 0.82rem; 
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .stats-item { 
            background: white; 
            padding: 10px 4px; 
            border-radius: 12px; 
            border: 1px solid #e2e8f0; 
            text-align: center; 
            height: 100%; 
            transition: all 0.2s ease; 
            cursor: pointer;
        }
        .stats-item:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.06); 
            border-color: #cbd5e1;
        }
        .stats-item.active {
            border-color: #0284c7;
            background-color: #f0f9ff;
            box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
        }
        .stats-val { 
            font-size: 1.25rem; 
            font-weight: 800; 
            color: var(--staff-blue); 
            line-height: 1.2;
        }
        .table-container { 
            background: white; 
            border-radius: 16px; 
            padding: 0; 
            min-height: 400px; 
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .student-input-group { 
            background: #f8fafc; 
            padding: 12px; 
            border-radius: 12px; 
            border: 1px solid #e2e8f0; 
        }
        .student-row-badge {
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .feedback-area { 
            background: #fefce8; 
            border-left: 5px solid #eab308; 
            padding: 16px; 
            border-radius: 16px; 
        }
        .student-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e3a8a;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 0.78rem;
            margin: 2px;
            font-weight: 600;
        }
        .class-tag {
            background: #dbeafe;
            color: #1e40af;
            font-size: 0.7rem;
            padding: 1px 5px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* 手機橫屏與直屏專用優化 */
        @media (max-height: 500px) {
            .modal-dialog {
                margin: 0.5rem auto !important;
            }
            .modal-content {
                max-height: 94vh !important;
            }
            .modal-body {
                overflow-y: auto !important;
                padding: 12px !important;
            }
        }
        .modal-content {
            border-radius: 20px;
            border: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            overflow: hidden;
        }

<div class="container-fluid px-3 px-md-4">
    <!-- 即時獲獎人次統計 (支援6人計算) -->
    <div class="card p-3 mb-3 shadow-sm border-0">
        <div class="d-flex justify-content-between align-items-center mb-2.5">
            <h6 class="fw-bold m-0 text-secondary d-flex align-items-center gap-2">
                <i class="bi bi-trophy-fill text-warning"></i>
                <span>即時獲獎人次統計 (按人數計，支援多達6人)</span>
            </h6>
            <div class="d-flex align-items-center gap-2">
                <span id="activeFilterBadge" class="badge bg-warning text-dark d-none" role="button" onclick="clearAwardFilter()"></span>
                <span class="badge bg-primary fs-6 fw-bold px-3 py-2 rounded-pill shadow-xs" id="totalCount">載入中...</span>
            </div>
        </div>
        <div class="row row-cols-3 row-cols-sm-4 row-cols-md-6 row-cols-xl-12 g-2" id="statsGrid"></div>
        <small id="backupStatus" class="mt-2 text-success fw-bold text-end" style="height: 20px;"></small>
    </div>

    <div class="row g-3">
        <!-- 左側面板：輸入與批次工具 -->
        <div class="col-xl-4 col-lg-5">
            <!-- 成績輸入 (支援最多 6 位學生) -->
            <div class="card shadow-sm mb-3 staff-only border-start border-4 border-primary">
                <div class="card-header bg-white fw-bold py-3 text-primary d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-plus-circle-fill me-2"></i>新增獲獎紀錄 (支援最多6人)</span>
                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle">教職員/管理員</span>
                </div>
                <div class="card-body">
                    <form id="recordForm">
                        <div class="mb-2">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="small fw-bold">比賽日期 *</label>
                                <a href="javascript:void(0)" class="small text-decoration-none" onclick="document.getElementById('f_date').value = new Date().toISOString().split('T')[0]">今天</a>
                            </div>
                            <input type="date" id="f_date" class="form-control form-control-sm" required>
                        </div>
                        <div class="mb-2">
                            <label class="small fw-bold">比賽名稱 *</label>
                            <input type="text" id="f_name" class="form-control form-control-sm" placeholder="比賽全稱" required>
                        </div>
                        
                        <!-- 獲獎學生與班別：擴充至 6 個人 -->
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="small fw-bold text-primary"><i class="bi bi-people-fill me-1"></i>獲獎學生與班別 (最多 6 人)</label>
                                <a href="javascript:void(0)" class="small text-muted text-decoration-none" onclick="clearExtraStudents()">清空2~6人</a>
                            </div>
                            <div class="student-input-group">
                                <!-- 學生 1 -->
                                <div class="row g-1 mb-1.5 align-items-center">
                                    <div class="col-auto"><span class="student-row-badge bg-primary text-white">1</span></div>
                                    <div class="col-7"><input type="text" id="f_stu1" class="form-control form-control-sm" placeholder="學生姓名 1 (必填)" required></div>
                                    <div class="col"><input type="text" id="f_class1" class="form-control form-control-sm" placeholder="班別 (如1A)" required></div>
                                </div>
                                <!-- 學生 2 -->
                                <div class="row g-1 mb-1.5 align-items-center">
                                    <div class="col-auto"><span class="student-row-badge bg-light text-secondary border">2</span></div>
                                    <div class="col-7"><input type="text" id="f_stu2" class="form-control form-control-sm" placeholder="學生姓名 2"></div>
                                    <div class="col"><input type="text" id="f_class2" class="form-control form-control-sm" placeholder="班別"></div>
                                </div>
                                <!-- 學生 3 -->
                                <div class="row g-1 mb-1.5 align-items-center">
                                    <div class="col-auto"><span class="student-row-badge bg-light text-secondary border">3</span></div>
                                    <div class="col-7"><input type="text" id="f_stu3" class="form-control form-control-sm" placeholder="學生姓名 3"></div>
                                    <div class="col"><input type="text" id="f_class3" class="form-control form-control-sm" placeholder="班別"></div>
                                </div>
                                <!-- 學生 4 -->
                                <div class="row g-1 mb-1.5 align-items-center">
                                    <div class="col-auto"><span class="student-row-badge bg-light text-secondary border">4</span></div>
                                    <div class="col-7"><input type="text" id="f_stu4" class="form-control form-control-sm" placeholder="學生姓名 4"></div>
                                    <div class="col"><input type="text" id="f_class4" class="form-control form-control-sm" placeholder="班別"></div>
                                </div>
                                <!-- 學生 5 (新增) -->
                                <div class="row g-1 mb-1.5 align-items-center">
                                    <div class="col-auto"><span class="student-row-badge bg-light text-secondary border">5</span></div>
                                    <div class="col-7"><input type="text" id="f_stu5" class="form-control form-control-sm" placeholder="學生姓名 5"></div>
                                    <div class="col"><input type="text" id="f_class5" class="form-control form-control-sm" placeholder="班別"></div>
                                </div>
                                <!-- 學生 6 (新增) -->
                                <div class="row g-1 align-items-center">
                                    <div class="col-auto"><span class="student-row-badge bg-light text-secondary border">6</span></div>
                                    <div class="col-7"><input type="text" id="f_stu6" class="form-control form-control-sm" placeholder="學生姓名 6"></div>
                                    <div class="col"><input type="text" id="f_class6" class="form-control form-control-sm" placeholder="班別"></div>
                                </div>
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                <label class="small fw-bold">類別</label>
                                <select id="f_cat" class="form-select form-select-sm">
                                    <option>中文</option><option>英文</option><option>數學</option><option>常識</option><option>科學</option><option>體育</option><option>視藝</option><option>音樂</option><option>學術</option><option>STEAM</option><option>其他</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="small fw-bold">負責老師 *</label>
                                <input type="text" id="f_teacher" class="form-control form-control-sm" placeholder="負責老師" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="small fw-bold">獎項 *</label>
                            <select id="f_award" class="form-select form-select-sm" onchange="checkOther(this, 'f_other_div')">
                                <option>冠軍</option><option>亞軍</option><option>季軍</option><option>殿軍</option><option>金獎</option><option>銀獎</option><option>銅獎</option><option>一等獎</option><option>二等獎</option><option>優良</option><option>優異獎</option><option value="其他">其他 (自行輸入具體獎項)...</option>
                            </select>
                        </div>
                        <div id="f_other_div" class="d-none mb-3 p-2.5 bg-warning bg-opacity-10 border border-warning rounded-3">
                            <label class="small fw-bold text-dark mb-1 d-block"><i class="bi bi-pencil-square me-1"></i>請在此輸入具體獎項名稱 *</label>
                            <input type="text" id="f_other_val" class="form-control form-control-sm bg-white" placeholder="例如：十八區個人卓越表現獎、入圍獎">
                        </div>
                        <button type="submit" id="submitBtn" class="btn btn-primary w-100 fw-bold shadow-sm py-2">
                            <i class="bi bi-send-fill me-1"></i>提交數據並發信通知
                        </button>
                    </form>
                </div>
            </div>

            <!-- 批量工具 (修正日期格式) -->
            <div class="card shadow-sm border-success staff-only">
                <div class="card-header bg-success text-white py-2 fw-bold d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-file-earmark-excel-fill me-2"></i>批次工具 & 備份</span>
                    <span class="badge bg-success-subtle text-white">Excel</span>
                </div>
                <div class="card-body">
                    <button class="btn btn-outline-success btn-sm w-100 mb-2 fw-bold" onclick="downloadTemplate()">
                        <i class="bi bi-download me-1"></i>下載匯入樣本 (支援6位學生)
                    </button>
                    <button class="btn btn-success btn-sm w-100 mb-2 fw-bold" onclick="document.getElementById('importFile').click()">
                        <i class="bi bi-upload me-1"></i>批量 Excel 匯入 (自動校正日期)
                    </button>
                    <input type="file" id="importFile" class="d-none" accept=".xlsx, .xls, .csv" onchange="handleExcelImport(this)">
                    <button class="btn btn-dark btn-sm w-100 mb-2 fw-bold" onclick="exportData()">
                        <i class="bi bi-database-down me-1"></i>導出雲端全表備份 (完整6人欄位)
                    </button>
                    <div class="admin-only">
                        <button class="btn btn-warning btn-sm w-100 mb-2 fw-bold" data-bs-toggle="modal" data-bs-target="#fbModal">
                            <i class="bi bi-chat-dots"></i> 查看意見反饋
                        </button>
                        <button class="btn btn-danger btn-sm w-100 fw-bold" onclick="clearDb()">
                            ⚠️ 清空雲端資料庫
                        </button>
                    </div>
                </div>
            </div>

            <!-- 留言板 -->
            <div class="card shadow-sm feedback-area">
                <h6 class="fw-bold mb-2 text-dark"><i class="bi bi-envelope-paper-fill text-warning me-2"></i>系統意見留言板</h6>
                <textarea id="feedbackIn" class="form-control mb-2" rows="2" placeholder="請輸入意見..."></textarea>
                <button class="btn btn-warning btn-sm w-100 fw-bold" id="feedbackBtn" onclick="submitFeedback()">
                    <i class="bi bi-send me-1"></i>發送至主任信箱
                </button>
            </div>
        </div>

        <!-- 右側面板：搜尋過濾與紀錄展示 -->
        <div class="col-xl-8 col-lg-7">
            <div class="card p-3 mb-3 border-0 shadow-sm bg-white">
                <div class="row g-2">
                    <div class="col-md-4">
                        <select id="filterCat" class="form-select form-select-sm" onchange="refreshUI()">
                            <option value="">-- 所有類別 --</option>
                            <option>中文</option><option>英文</option><option>數學</option><option>常識</option><option>科學</option><option>體育</option><option>視藝</option><option>音樂</option><option>學術</option><option>STEAM</option><option>其他</option>
                        </select>
                    </div>
                    <div class="col-md-5">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                            <input type="text" id="searchInput" class="form-control" placeholder="搜尋學生(最多6人)、班別、比賽或老師..." oninput="refreshUI()">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <button id="exportFilterBtn" class="btn btn-primary btn-sm w-100 d-none fw-bold" onclick="exportFilteredData()">
                            <i class="bi bi-download me-1"></i>導出此報表
                        </button>
                    </div>
                </div>
            </div>

            <div class="table-container shadow-sm p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 105px;">日期</th>
                                <th>比賽詳情</th>
                                <th>獲獎名單 (班別)</th>
                                <th>老師</th>
                                <th>獎項</th>
                                <th class="staff-only text-end" style="width: 60px;"></th>
                            </tr>
                        </thead>
                        <tbody id="dataTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal 意見紀錄 -->
<div class="modal fade" id="fbModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">

            <div class="modal-header bg-warning fw-bold">
                <h5 class="modal-title"><i class="bi bi-chat-left-text-fill me-2"></i>意見反饋紀錄</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0">
                <div id="feedbackList" class="list-group list-group-flush"></div>
            </div>
        </div>
    </div>
</div>

    // --- 日期智能轉換工具 (解決 Excel 序號如 45584 變成編號的錯誤) ---
    function parseExcelDate(val) {
        if (val === null || val === undefined || val === '') return '';
        if (val instanceof Date && !isNaN(val)) {
            const y = val.getFullYear();
            const m = String(val.getMonth() + 1).padStart(2, '0');
            const d = String(val.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }
        if (typeof val === 'number' || (!isNaN(Number(val)) && String(val).trim() !== '' && !String(val).includes('-') && !String(val).includes('/'))) {
            const num = Number(val);
            if (num > 10000 && num < 100000) {
                // Excel base date 1899-12-30 (25569 days to 1970-01-01)
                const date = new Date(Math.round((num - 25569) * 86400 * 1000));
                const y = date.getUTCFullYear();
                const m = String(date.getUTCMonth() + 1).padStart(2, '0');
                const d = String(date.getUTCDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }
        }
        const s = String(val).trim();
        const matchYMD = s.match(/^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})日?$/);
        if (matchYMD) {
            return `${matchYMD[1]}-${matchYMD[2].padStart(2, '0')}-${matchYMD[3].padStart(2, '0')}`;
        }
        const matchDMY = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
        if (matchDMY) {
            return `${matchDMY[3]}-${matchDMY[2].padStart(2, '0')}-${matchDMY[1].padStart(2, '0')}`;
        }
        return s;
    }

    // --- 批量 Excel 匯入：自動智能校正日期 (徹底解決 45584 編號問題) ---
    window.handleExcelImport = (input) => {
        const file = input.files[0];
        if (!file) return;
        const r = new FileReader(); 
        r.onload = async (e) => {
            try {
                const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
                const j = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                const b = writeBatch(db); 
                let count = 0;

                j.forEach(row => {
                    const c = {}; 
                    Object.keys(row).forEach(k => {
                        c[k.toString().trim().replace(/[\s\-_]/g, '')] = row[k];
                    });

                    // 智慧日期解析
                    const rawDate = c["日期"] || c["比賽日期"] || c["活動日期"] || "";
                    const validDate = parseExcelDate(rawDate);

                    const name = c["比賽名稱"] || c["活動名稱"] || c["比賽"] || "";
                    if (!name && !validDate) return;

                    const stu1 = c["姓名1"] || c["姓名"] || c["學生"] || "";
                    const class1 = c["班別1"] || c["班別"] || c["班級"] || "";

                    b.set(doc(colRef), { 
                        date: validDate || "", 
                        name: name || "", 
                        stu1: stu1, 
                        class1: class1,
                        stu2: c["姓名2"] || c["stu2"] || "",
                        class2: c["班別2"] || c["class2"] || "",
                        stu3: c["姓名3"] || c["stu3"] || "",
                        class3: c["班別3"] || c["class3"] || "",

                        class4: c["班別4"] || c["class4"] || "",
                        stu5: c["姓名5"] || c["stu5"] || "",
                        class5: c["班別5"] || c["class5"] || "",

                        cat: c["類別"] || "學術", 
                        award: c["獎項"] || c["名次"] || "" 
                    });
                    count++;
                });

                await b.commit();

    };
    
    // 初始化身分
    applyRoleUI(currentRole);
</script>
