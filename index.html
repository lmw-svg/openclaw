<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>盧光煇紀念學校學生的公開成績輸入系統</title>
    <!-- 資源引入 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary-dark: #1e293b;
            --staff-blue: #0284c7;
            --accent-gold: #d97706;
        }
        body {
            background-color: #f1f5f9;
            font-family: system-ui, -apple-system, "Microsoft JhengHei", sans-serif;
            color: #0f172a;
        }
        .navbar {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%) !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .card {
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
            margin-bottom: 20px;
            overflow: hidden;
        }

        /* 使用 body class 控制權限顯示，避免破壞 table-cell / flex 版面 */
        .staff-only, .admin-only { display: none; }
        body.role-staff .staff-only,
        body.role-admin .staff-only { display: block; }
        body.role-staff th.staff-only,
        body.role-staff td.staff-only,
        body.role-admin th.staff-only,
        body.role-admin td.staff-only { display: table-cell; }
        body.role-admin .admin-only { display: block; }

        .role-badge {
            padding: 6px 14px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.82rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .stats-item {
            background: white;
            padding: 10px 4px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            text-align: center;
            height: 100%;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .stats-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            border-color: #cbd5e1;
        }
        .stats-item.active {
            border-color: #0284c7;
            background-color: #f0f9ff;
            box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
        }
        .stats-val {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--staff-blue);
            line-height: 1.2;
        }
        .table-container {
            background: white;
            border-radius: 16px;
            padding: 0;
            min-height: 400px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .student-input-group {
            background: #f8fafc;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        .student-row-badge {
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .feedback-area {
            background: #fefce8;
            border-left: 5px solid #eab308;
            padding: 16px;
            border-radius: 16px;
        }
        .student-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e3a8a;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 0.78rem;
            margin: 2px;
            font-weight: 600;
        }
        .class-tag {
            background: #dbeafe;
            color: #1e40af;
            font-size: 0.7rem;
            padding: 1px 5px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* 手機橫屏與直屏專用優化 */
        @media (max-height: 500px) {
            .modal-dialog {
                margin: 0.5rem auto !important;
            }
            .modal-content {
                max-height: 94vh !important;
            }
            .modal-body {
                overflow-y: auto !important;
                padding: 12px !important;
            }
        }
        .modal-content {
            border-radius: 20px;
            border: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            overflow: hidden;
        }
    </style>
</head>
<body class="role-viewer">

<nav class="navbar navbar-expand navbar-dark mb-3 px-3">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2 text-truncate" href="#">
            <i class="bi bi-award-fill text-warning fs-4 flex-shrink-0"></i>
            <span class="text-truncate">盧光煇紀念學校學生的公開成績輸入系統</span>
        </a>
        <div class="ms-auto d-flex align-items-center gap-2 flex-shrink-0">
            <span id="roleDisplay" class="role-badge bg-secondary text-white">訪客模式</span>
            <div class="dropdown">
                <button class="btn btn-outline-light btn-sm dropdown-toggle fw-bold" type="button" data-bs-toggle="dropdown">
                    身分切換
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-3">
                    <li><a class="dropdown-item py-2 fw-semibold" href="javascript:void(0)" onclick="triggerLogin('staff')"><i class="bi bi-person-badge text-primary me-2"></i>教職員 (Staff)</a></li>
                    <li><a class="dropdown-item py-2 fw-semibold" href="javascript:void(0)" onclick="triggerLogin('admin')"><i class="bi bi-shield-lock-fill text-danger me-2"></i>管理員 (Admin)</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item py-2 text-danger fw-semibold" href="javascript:void(0)" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>登出 / 鎖定</a></li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<div class="container-fluid px-3 px-md-4">
    <!-- 即時獲獎人次統計 (支援6人計算) -->
    <div class="card p-3 mb-3 shadow-sm border-0">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
            <h6 class="fw-bold m-0 text-secondary d-flex align-items-center gap-2">
                <i class="bi bi-trophy-fill text-warning"></i>
                <span>即時獲獎人次統計 (按人數計，支援多達6人)</span>
            </h6>
            <div class="d-flex align-items-center gap-2">
                <span id="activeFilterBadge" class="badge bg-warning text-dark d-none" role="button" onclick="clearAwardFilter()"></span>
                <span class="badge bg-primary fs-6 fw-bold px-3 py-2 rounded-pill shadow-xs" id="totalCount">載入中...</span>
            </div>
        </div>
        <div class="row row-cols-3 row-cols-sm-4 row-cols-md-6 g-2" id="statsGrid"></div>
        <small id="backupStatus" class="mt-2 text-success fw-bold text-end" style="min-height: 20px;"></small>
    </div>

    <div class="row g-3">
        <!-- 左側面板：輸入與批次工具 -->
        <div class="col-xl-4 col-lg-5">
            <!-- 成績輸入 (支援最多 6 位學生) -->
            <div class="card shadow-sm mb-3 staff-only border-start border-4 border-primary">
                <div class="card-header bg-white fw-bold py-3 text-primary d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-plus-circle-fill me-2"></i>新增獲獎紀錄 (支援最多6人)</span>
                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle">教職員/管理員</span>
                </div>
                <div class="card-body">
                    <form id="recordForm" novalidate>
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <div class="d-flex justify-content-between align-items-center">
                                    <label class="small fw-bold">比賽日期 *</label>
                                    <a href="javascript:void(0)" class="small text-decoration-none" onclick="setTodayDate('f_date')">今天</a>
                                </div>
                                <input type="date" id="f_date" class="form-control form-control-sm" required>
                            </div>
                            <div class="col-6">
                                <div class="d-flex justify-content-between align-items-center">
                                    <label class="small fw-bold text-success">輸入日期</label>
                                    <a href="javascript:void(0)" class="small text-decoration-none" onclick="setTodayDate('f_input_date')">今天</a>
                                </div>
                                <input type="date" id="f_input_date" class="form-control form-control-sm">
                            </div>
                        </div>
                        <div class="mb-2">
                            <label class="small fw-bold">比賽名稱 *</label>
                            <input type="text" id="f_name" class="form-control form-control-sm" placeholder="比賽全稱" required>
                        </div>

                        <!-- 獲獎學生與班別：擴充至 6 個人 -->
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="small fw-bold text-primary"><i class="bi bi-people-fill me-1"></i>獲獎學生與班別 (最多 6 人)</label>
                                <a href="javascript:void(0)" class="small text-muted text-decoration-none" onclick="clearExtraStudents()">清空2~6人</a>
                            </div>
                            <div class="student-input-group">
                                <div class="d-flex gap-1.5 mb-1 align-items-center">
                                    <span class="student-row-badge bg-primary text-white">1</span>
                                    <input type="text" id="f_stu1" class="form-control form-control-sm" placeholder="學生姓名 1 (必填)" required>
                                    <input type="text" id="f_class1" class="form-control form-control-sm" style="max-width: 96px;" placeholder="班別 (1A)" required>
                                </div>
                                <div class="d-flex gap-1.5 mb-1 align-items-center">
                                    <span class="student-row-badge bg-light text-secondary border">2</span>
                                    <input type="text" id="f_stu2" class="form-control form-control-sm" placeholder="學生姓名 2">
                                    <input type="text" id="f_class2" class="form-control form-control-sm" style="max-width: 96px;" placeholder="班別">
                                </div>
                                <div class="d-flex gap-1.5 mb-1 align-items-center">
                                    <span class="student-row-badge bg-light text-secondary border">3</span>
                                    <input type="text" id="f_stu3" class="form-control form-control-sm" placeholder="學生姓名 3">
                                    <input type="text" id="f_class3" class="form-control form-control-sm" style="max-width: 96px;" placeholder="班別">
                                </div>
                                <div class="d-flex gap-1.5 mb-1 align-items-center">
                                    <span class="student-row-badge bg-light text-secondary border">4</span>
                                    <input type="text" id="f_stu4" class="form-control form-control-sm" placeholder="學生姓名 4">
                                    <input type="text" id="f_class4" class="form-control form-control-sm" style="max-width: 96px;" placeholder="班別">
                                </div>
                                <div class="d-flex gap-1.5 mb-1 align-items-center">
                                    <span class="student-row-badge bg-light text-secondary border">5</span>
                                    <input type="text" id="f_stu5" class="form-control form-control-sm" placeholder="學生姓名 5">
                                    <input type="text" id="f_class5" class="form-control form-control-sm" style="max-width: 96px;" placeholder="班別">
                                </div>
                                <div class="d-flex gap-1.5 align-items-center">
                                    <span class="student-row-badge bg-light text-secondary border">6</span>
                                    <input type="text" id="f_stu6" class="form-control form-control-sm" placeholder="學生姓名 6">
                                    <input type="text" id="f_class6" class="form-control form-control-sm" style="max-width: 96px;" placeholder="班別">
                                </div>
                            </div>
                        </div>

                        <div class="row mb-2 g-2">
                            <div class="col-6">
                                <label class="small fw-bold">類別</label>
                                <select id="f_cat" class="form-select form-select-sm">
                                    <option>中文</option><option>英文</option><option>數學</option><option>常識</option><option>科學</option><option>體育</option><option>視藝</option><option>音樂</option><option>學術</option><option>STEAM</option><option>其他</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="small fw-bold">負責老師 *</label>
                                <input type="text" id="f_teacher" class="form-control form-control-sm" placeholder="負責老師" required>
                            </div>
                        </div>

                        <div class="mb-2">
                            <label class="small fw-bold">獎項 *</label>
                            <select id="f_award" class="form-select form-select-sm" onchange="checkOther(this, 'f_other_div', 'f_other_val')">
                                <option>冠軍</option><option>亞軍</option><option>季軍</option><option>殿軍</option><option>金獎</option><option>銀獎</option><option>銅獎</option><option>一等獎</option><option>二等獎</option><option>優良</option><option>優異獎</option><option value="其他">其他 (自行輸入具體獎項)...</option>
                            </select>
                        </div>
                        <div id="f_other_div" class="d-none mb-2 p-2.5 bg-warning bg-opacity-10 border border-warning rounded-3">
                            <label class="small fw-bold text-dark mb-1 d-block"><i class="bi bi-pencil-square me-1"></i>請在此輸入具體獎項名稱 *</label>
                            <input type="text" id="f_other_val" class="form-control form-control-sm bg-white" placeholder="例如：十八區個人卓越表現獎、入圍獎">
                        </div>

                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="keepCompInfo">
                            <label class="form-check-label small text-secondary" for="keepCompInfo">
                                提交後保留日期、比賽名稱、類別與老師（方便連續輸入）
                            </label>
                        </div>

                        <div id="formFeedbackMsg" class="d-none alert py-2 px-3 small mb-2"></div>

                        <button type="submit" id="submitBtn" class="btn btn-primary w-100 fw-bold shadow-sm py-2">
                            <i class="bi bi-send-fill me-1"></i>提交數據並發信通知
                        </button>
                    </form>
                </div>
            </div>

            <!-- 批量工具 (修正日期格式) -->
            <div class="card shadow-sm border-success staff-only">
                <div class="card-header bg-success text-white py-2 fw-bold d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-file-earmark-excel-fill me-2"></i>批次工具 & 備份</span>
                    <span class="badge bg-white text-success">Excel</span>
                </div>
                <div class="card-body">
                    <button class="btn btn-outline-success btn-sm w-100 mb-2 fw-bold" onclick="downloadTemplate()">
                        <i class="bi bi-download me-1"></i>下載匯入樣本 (支援6位學生)
                    </button>
                    <button class="btn btn-success btn-sm w-100 mb-2 fw-bold" onclick="document.getElementById('importFile').click()">
                        <i class="bi bi-upload me-1"></i>批量 Excel 匯入 (自動校正日期)
                    </button>
                    <input type="file" id="importFile" class="d-none" accept=".xlsx, .xls, .csv" onchange="handleExcelImport(this)">
                    <button class="btn btn-dark btn-sm w-100 mb-2 fw-bold" onclick="exportData()">
                        <i class="bi bi-database-down me-1"></i>導出雲端全表備份 (完整6人欄位)
                    </button>

                    <!-- 偵測到舊序號日期時的修復區 -->
                    <div id="repairDatesBox" class="d-none p-2.5 mb-2 bg-warning bg-opacity-10 border border-warning rounded-3 small">
                        <div class="fw-bold text-dark mb-1"><i class="bi bi-wrench-adjustable me-1 text-warning"></i>偵測到 <span id="serialCountSpan">0</span> 筆舊序號日期</div>
                        <button class="btn btn-warning btn-sm w-100 fw-bold" onclick="fixLegacyDates()">一鍵修復雲端日期格式</button>
                    </div>

                    <div class="admin-only pt-1">
                        <button class="btn btn-warning btn-sm w-100 mb-2 fw-bold" data-bs-toggle="modal" data-bs-target="#fbModal">
                            <i class="bi bi-chat-dots"></i> 查看意見反饋
                        </button>
                        <button class="btn btn-danger btn-sm w-100 fw-bold" onclick="clearDb()">
                            ⚠️ 清空雲端資料庫
                        </button>
                    </div>
                </div>
            </div>

            <!-- 留言板 -->
            <div class="card shadow-sm feedback-area">
                <h6 class="fw-bold mb-2 text-dark"><i class="bi bi-envelope-paper-fill text-warning me-2"></i>系統意見留言板</h6>
                <textarea id="feedbackIn" class="form-control mb-2" rows="2" placeholder="請輸入意見..."></textarea>
                <button class="btn btn-warning btn-sm w-100 fw-bold" id="feedbackBtn" onclick="submitFeedback()">
                    <i class="bi bi-send me-1"></i>發送至主任信箱
                </button>
            </div>
        </div>

        <!-- 右側面板：搜尋過濾與紀錄展示 -->
        <div class="col-xl-8 col-lg-7">
            <div class="card p-3 mb-3 border-0 shadow-sm bg-white">
                <div class="row g-2">
                    <div class="col-md-4">
                        <select id="filterCat" class="form-select form-select-sm" onchange="refreshUI()">
                            <option value="">-- 所有類別 --</option>
                            <option>中文</option><option>英文</option><option>數學</option><option>常識</option><option>科學</option><option>體育</option><option>視藝</option><option>音樂</option><option>學術</option><option>STEAM</option><option>其他</option>
                        </select>
                    </div>
                    <div class="col-md-5">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                            <input type="text" id="searchInput" class="form-control" placeholder="搜尋學生(最多6人)、班別、比賽或老師..." oninput="refreshUI()">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <button id="exportFilterBtn" class="btn btn-primary btn-sm w-100 d-none fw-bold" onclick="exportFilteredData()">
                            <i class="bi bi-download me-1"></i>導出此報表
                        </button>
                    </div>
                </div>
            </div>

            <div class="table-container shadow-sm p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 120px;">日期</th>
                                <th>比賽詳情</th>
                                <th>獲獎名單 (班別)</th>
                                <th>老師</th>
                                <th>獎項</th>
                                <th class="staff-only text-end" style="width: 86px;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="dataTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal 編輯紀錄 (支援 6 位學生及自訂獎項) -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header py-2.5 bg-primary text-white">
                <h6 class="modal-title fw-bold"><i class="bi bi-pencil-square me-2"></i>編輯獲獎紀錄</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="editForm">
                <div class="modal-body p-3">
                    <input type="hidden" id="e_id">
                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <label class="small fw-bold">比賽日期 *</label>
                            <input type="date" id="e_date" class="form-control form-control-sm" required>
                        </div>
                        <div class="col-6">
                            <label class="small fw-bold text-success">輸入日期</label>
                            <input type="date" id="e_input_date" class="form-control form-control-sm">
                        </div>
                    </div>
                    <div class="mb-2">
                        <label class="small fw-bold">比賽名稱 *</label>
                        <input type="text" id="e_name" class="form-control form-control-sm" required>
                    </div>
                    <div class="mb-2">
                        <label class="small fw-bold text-primary">獲獎學生與班別 (最多 6 人)</label>
                        <div class="student-input-group">
                            <div class="d-flex gap-1.5 mb-1 align-items-center">
                                <span class="student-row-badge bg-primary text-white">1</span>
                                <input type="text" id="e_stu1" class="form-control form-control-sm" placeholder="姓名 1" required>
                                <input type="text" id="e_class1" class="form-control form-control-sm" style="max-width: 90px;" placeholder="班別">
                            </div>
                            <div class="d-flex gap-1.5 mb-1 align-items-center">
                                <span class="student-row-badge bg-light text-secondary border">2</span>
                                <input type="text" id="e_stu2" class="form-control form-control-sm" placeholder="姓名 2">
                                <input type="text" id="e_class2" class="form-control form-control-sm" style="max-width: 90px;" placeholder="班別">
                            </div>
                            <div class="d-flex gap-1.5 mb-1 align-items-center">
                                <span class="student-row-badge bg-light text-secondary border">3</span>
                                <input type="text" id="e_stu3" class="form-control form-control-sm" placeholder="姓名 3">
                                <input type="text" id="e_class3" class="form-control form-control-sm" style="max-width: 90px;" placeholder="班別">
                            </div>
                            <div class="d-flex gap-1.5 mb-1 align-items-center">
                                <span class="student-row-badge bg-light text-secondary border">4</span>
                                <input type="text" id="e_stu4" class="form-control form-control-sm" placeholder="姓名 4">
                                <input type="text" id="e_class4" class="form-control form-control-sm" style="max-width: 90px;" placeholder="班別">
                            </div>
                            <div class="d-flex gap-1.5 mb-1 align-items-center">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBD1iahWhbqDElEaZGIS8YAdQR3RtdqS8s",
        authDomain: "lkfms-30e77.firebaseapp.com",
        projectId: "lkfms-30e77",
        storageBucket: "lkfms-30e77.firebasestorage.app",
        messagingSenderId: "451297059058",
        appId: "1:451297059058:web:860dae00c20d00276c306b",

    };

    const EMAILJS_CONFIG = {

    const app = initializeApp(firebaseConfig);

    const PASS = {
        staff: "c3RhZmY4ODg=", // staff888

    const awardOptions = ["冠軍", "亞軍", "季軍", "殿軍", "金獎", "銀獎", "銅獎", "一等獎", "二等獎", "優良", "優異獎"];
    const loginModal = new bootstrap.Modal(document.getElementById('loginModal'));
    const editModal = new bootstrap.Modal(document.getElementById('editModal'));

    function getLocalToday() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    window.setTodayDate = (targetId) => {
        const today = getLocalToday();
        if (targetId) {
            const el = document.getElementById(targetId);
            if (el) el.value = today;
        } else {
            document.getElementById('f_date').value = today;
            const inpEl = document.getElementById('f_input_date');
            if (inpEl) inpEl.value = today;
        }
    };
    setTodayDate();

    // --- 日期智能轉換工具 (解決 Excel 序號如 45584 變成編號的錯誤) ---
    function parseExcelDate(val) {
        if (val === null || val === undefined || val === '') return '';
        if (val instanceof Date && !isNaN(val)) {
            const safe = new Date(val.getTime() + 12 * 3600 * 1000);
            const y = safe.getUTCFullYear();
            const m = String(safe.getUTCMonth() + 1).padStart(2, '0');
            const d = String(safe.getUTCDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }
        if (typeof val === 'number' || (!isNaN(Number(val)) && String(val).trim() !== '' && !String(val).includes('-') && !String(val).includes('/') && !String(val).includes('.'))) {
            const num = Number(val);
            if (num > 10000 && num < 100000) {
                const date = new Date(Math.round((num - 25569) * 86400 * 1000));
                const y = date.getUTCFullYear();
                const m = String(date.getUTCMonth() + 1).padStart(2, '0');
                const d = String(date.getUTCDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }
        }
        const s = String(val).trim();
        const matchYMD = s.match(/^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})日?$/);
        if (matchYMD) {
            return `${matchYMD[1]}-${matchYMD[2].padStart(2, '0')}-${matchYMD[3].padStart(2, '0')}`;
        }
        const matchDMY = s.match(/^(\d{1,2})[-/. ](\d{1,2})[-/. ](\d{4})$/);
        if (matchDMY) {
            return `${matchDMY[3]}-${matchDMY[2].padStart(2, '0')}-${matchDMY[1].padStart(2, '0')}`;
        }
        return s;
    }

    function isSerialDateVal(val) {
        if (typeof val === 'number' && val > 10000 && val < 100000) return true;
        if (typeof val === 'string' && /^\d{5}$/.test(val.trim())) return true;
        return false;
    }

    function showFormMsg(type, msg) {
        const el = document.getElementById('formFeedbackMsg');
        el.className = `alert alert-${type} py-2 px-3 small mb-2`;
        el.innerText = msg;
        el.classList.remove('d-none');
        if (type === 'success') {
            setTimeout(() => el.classList.add('d-none'), 4000);
        }
    }

    // 監聽雲端紀錄
    onSnapshot(colRef, (s) => {
        records = s.docs.map(d => ({ id: d.id, ...d.data() }));
        records.sort((a, b) => {
            const da = parseExcelDate(a.date);
            const dbDate = parseExcelDate(b.date);
            return dbDate.localeCompare(da);
        });
        const serialCount = records.filter(r => isSerialDateVal(r.date)).length;
        const repairBox = document.getElementById('repairDatesBox');
        if (serialCount > 0) {
            document.getElementById('serialCountSpan').innerText = serialCount;
            repairBox.classList.remove('d-none');
        } else {
            repairBox.classList.add('d-none');
        }
        refreshUI();
    });

    // 監聽意見紀錄
    onSnapshot(query(fbRef, orderBy("timestamp", "desc"), limit(50)), (s) => {
        document.getElementById('feedbackList').innerHTML = s.docs.map(d => {
            const data = d.data();
            const time = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleString() : '剛才';
            return `<div class="list-group-item"><div class="d-flex w-100 justify-content-between"><h6 class="mb-1 fw-bold text-primary">意見回饋</h6><small class="text-muted">${time}</small></div><p class="mb-1 small">${data.content}</p></div>`;
        }).join('');
    });

    async function doBackup(type, extraList = null) {
        try {
            const snapshotData = extraList || records;
            await addDoc(backupRef, { timestamp: serverTimestamp(), action: type, data: JSON.stringify(snapshotData) });
            document.getElementById('backupStatus').innerText = "☁️ 已自動備份至雲端";
            setTimeout(() => document.getElementById('backupStatus').innerText = "", 3000);
        } catch (e) {}
    }

    window.clearExtraStudents = () => {
        for (let i = 2; i <= 6; i++) {
            document.getElementById(`f_stu${i}`).value = '';
            document.getElementById(`f_class${i}`).value = '';
        }
    };

    // 表單提交：支援 6 個人，修復隱藏 required 鎖死問題
    document.getElementById('recordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        document.getElementById('formFeedbackMsg').classList.add('d-none');

        const dateVal = parseExcelDate(document.getElementById('f_date').value);
        const inputDateVal = parseExcelDate(document.getElementById('f_input_date').value) || getLocalToday();
        const nameVal = document.getElementById('f_name').value.trim();
        const teacherVal = document.getElementById('f_teacher').value.trim();
        const stu1Val = document.getElementById('f_stu1').value.trim();
        const class1Val = document.getElementById('f_class1').value.trim();

        if (!dateVal) { showFormMsg('danger', '請選擇比賽日期'); document.getElementById('f_date').focus(); return; }
        if (!nameVal) { showFormMsg('danger', '請輸入比賽名稱'); document.getElementById('f_name').focus(); return; }
        if (!stu1Val || !class1Val) { showFormMsg('danger', '請填寫第 1 位學生的姓名及班別'); document.getElementById('f_stu1').focus(); return; }
        if (!teacherVal) { showFormMsg('danger', '請填寫負責老師'); document.getElementById('f_teacher').focus(); return; }

        for (let i = 2; i <= 6; i++) {
            const sVal = document.getElementById(`f_stu${i}`).value.trim();
            const cVal = document.getElementById(`f_class${i}`).value.trim();
            if (cVal && !sVal) {
                showFormMsg('danger', `第 ${i} 位已填寫班別，請補上學生姓名`);
                document.getElementById(`f_stu${i}`).focus();
                return;
            }
        }

        const awardVal = document.getElementById('f_award').value;
        const otherVal = document.getElementById('f_other_val').value.trim();
        const isOtherAward = (awardVal === '其他' || awardVal.startsWith('其他'));

        if (isOtherAward && !otherVal) {
            showFormMsg('danger', '您選擇了「其他」，請在下方填寫具體獎項名稱！');
            document.getElementById('f_other_val').focus();
            return;
        }

        const finalAward = isOtherAward ? otherVal : awardVal;
        const names = [1,2,3,4,5,6].map(i => document.getElementById(`f_stu${i}`).value.trim()).filter(Boolean);

        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> 正在同步雲端...`;

        const entry = {
            date: dateVal,
            inputDate: inputDateVal,
            name: nameVal,
            stu1: stu1Val,
            class1: class1Val,
            stu2: document.getElementById('f_stu2').value.trim(),
            class2: document.getElementById('f_class2').value.trim(),
            stu3: document.getElementById('f_stu3').value.trim(),
            class3: document.getElementById('f_class3').value.trim(),
            stu4: document.getElementById('f_stu4').value.trim(),
            class4: document.getElementById('f_class4').value.trim(),
            stu5: document.getElementById('f_stu5').value.trim(),
            class5: document.getElementById('f_class5').value.trim(),
            stu6: document.getElementById('f_stu6').value.trim(),
            class6: document.getElementById('f_class6').value.trim(),
            teacher: teacherVal,
            cat: document.getElementById('f_cat').value,
            award: finalAward
        };

        try {
            const addedRef = await addDoc(colRef, entry);
            doBackup("ADD", [...records, { id: addedRef.id, ...entry }]);

            try { confetti({ particleCount: 60, spread: 70, origin: { y: 0.8 } }); } catch(c) {}

            const keepInfo = document.getElementById('keepCompInfo').checked;
            if (!keepInfo) {
                e.target.reset();
                setTodayDate();
                document.getElementById('f_other_div').classList.add('d-none');
                document.getElementById('f_other_val').required = false;
                document.getElementById('f_other_val').value = '';
            } else {
                for (let i = 1; i <= 6; i++) {
                    document.getElementById(`f_stu${i}`).value = '';
                    document.getElementById(`f_class${i}`).value = '';
                }
            }

            showFormMsg('success', '✅ 成功！數據已存入雲端。');

            emailjs.send(EMAILJS_CONFIG.SERVICE_ID, EMAILJS_CONFIG.TEMPLATE_ID, {
                to_email: "lmw@lkfms.edu.hk",
                student_name: names.join(", "),
                comp_name: entry.name,
                award_name: entry.award,
                comp_date: entry.date
            }).catch(() => {});
        } catch (dbErr) {
            showFormMsg('danger', '❌ 同步失敗: ' + dbErr.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = `<i class="bi bi-send-fill me-1"></i>提交數據並發信通知`;
        }
    });

    function formatStudents(r) {
        const arr = [];
        if (r.stu1) arr.push(`<span class="student-pill">${r.stu1} <span class="class-tag">${r.class1||''}</span></span>`);
        else if (r.student) arr.push(`<span class="student-pill">${r.student} <span class="class-tag">${r.class||''}</span></span>`);

        if (r.stu2) arr.push(`<span class="student-pill">${r.stu2} <span class="class-tag">${r.class2||''}</span></span>`);
        if (r.stu3) arr.push(`<span class="student-pill">${r.stu3} <span class="class-tag">${r.class3||''}</span></span>`);
        if (r.stu4) arr.push(`<span class="student-pill">${r.stu4} <span class="class-tag">${r.class4||''}</span></span>`);
        if (r.stu5) arr.push(`<span class="student-pill">${r.stu5} <span class="class-tag">${r.class5||''}</span></span>`);
        if (r.stu6) arr.push(`<span class="student-pill">${r.stu6} <span class="class-tag">${r.class6||''}</span></span>`);

        return arr.join('');
    }

    // --- UI 渲染邏輯 ---
    window.refreshUI = function() {
        const tbody = document.getElementById('dataTable');
        const search = document.getElementById('searchInput').value.trim().toLowerCase();
        const cat = document.getElementById('filterCat').value;

        const f = records.filter(r => {
            if (cat !== "" && r.cat !== cat) return false;
            if (selectedAward !== "") {
                if (selectedAward === "其他") {
                    if (awardOptions.includes(r.award)) return false;
                } else if (r.award !== selectedAward) {
                    return false;
                }
            }
            if (search !== "") {
                const combined = (
                    (r.stu1||"")+(r.class1||"")+
                    (r.stu2||"")+(r.class2||"")+
                    (r.stu3||"")+(r.class3||"")+
                    (r.stu4||"")+(r.class4||"")+
                    (r.stu5||"")+(r.class5||"")+
                    (r.stu6||"")+(r.class6||"")+
                    (r.student||"")+(r.class||"")+
                    (r.name||"")+(r.teacher||"")+(r.award||"")+parseExcelDate(r.date)+(r.inputDate ? parseExcelDate(r.inputDate) : "")
                ).toLowerCase();
                if (!combined.includes(search)) return false;
            }
            return true;
        });

        document.getElementById('exportFilterBtn').classList.toggle('d-none', (search==="" && cat==="" && selectedAward==="") || f.length === 0);

        tbody.innerHTML = f.map(r => {
            const formattedDate = parseExcelDate(r.date) || r.date;
            const formattedInputDate = r.inputDate ? parseExcelDate(r.inputDate) : '';
            return `<tr>
                <td class="small font-monospace fw-semibold">
                    <div>${formattedDate}</div>
                    ${formattedInputDate ? `<div class="text-success" style="font-size:0.7rem;">輸入：${formattedInputDate}</div>` : ''}
                </td>
                <td><b>${r.name || ''}</b><br><small class="badge bg-light text-dark border">${r.cat||'學術'}</small></td>
                <td><div class="d-flex flex-wrap">${formatStudents(r)}</div></td>
                <td class="small text-secondary">${r.teacher||'---'}</td>
                <td class="text-primary fw-bold">${r.award || ''}</td>
                <td class="staff-only text-end text-nowrap">
                    <button class="btn btn-sm text-primary" title="編輯" onclick="window.openEditRec('${r.id}')"><i class="bi bi-pencil-square"></i></button>
                    <button class="btn btn-sm text-danger" title="刪除" onclick="window.delRec('${r.id}')"><i class="bi bi-trash-fill"></i></button>
                </td>
            </tr>`;
        }).join('');

        renderStats(f);
    };

    function renderStats(data) {
        const counts = {};
        let total = 0;
        [...awardOptions, "其他"].forEach(a => counts[a] = 0);

        data.forEach(r => {
            let p = [r.stu1, r.stu2, r.stu3, r.stu4, r.stu5, r.stu6].filter(Boolean).length || (r.student ? 1 : 0);
            if (awardOptions.includes(r.award)) counts[r.award] += p;
            else counts["其他"] += p;
            total += p;
        });

        document.getElementById('totalCount').innerText = `目前顯示: ${total} 人次`;
        document.getElementById('statsGrid').innerHTML = [...awardOptions, "其他"].map(l => {
            const isAct = selectedAward === l;
            return `<div class="col">
                <div class="stats-item ${isAct ? 'active' : ''}" onclick="filterByAward('${l}')">
                    <div class="small text-muted" style="font-size: 0.72rem;">${l}</div>
                    <div class="stats-val">${counts[l]}</div>
                </div>
            </div>`;
        }).join('');
    }

    window.filterByAward = (award) => {
        selectedAward = (selectedAward === award) ? '' : award;
        const badge = document.getElementById('activeFilterBadge');
        if (selectedAward) {
            badge.innerText = `篩選: ${selectedAward} ✕`;
            badge.classList.remove('d-none');
        } else {
            badge.classList.add('d-none');
        }
        refreshUI();
    };

    window.clearAwardFilter = () => {
        selectedAward = '';
        document.getElementById('activeFilterBadge').classList.add('d-none');
        refreshUI();
    };

    // --- 編輯紀錄功能 ---
    window.openEditRec = (id) => {
        const r = records.find(x => x.id === id);
        if (!r) return;
        document.getElementById('e_id').value = r.id;
        document.getElementById('e_date').value = parseExcelDate(r.date);
        document.getElementById('e_input_date').value = r.inputDate ? parseExcelDate(r.inputDate) : getLocalToday();
        document.getElementById('e_name').value = r.name || '';
        document.getElementById('e_cat').value = r.cat || '學術';
        document.getElementById('e_teacher').value = r.teacher || '';

        document.getElementById('e_stu1').value = r.stu1 || r.student || '';
        document.getElementById('e_class1').value = r.class1 || r.class || '';
        for (let i = 2; i <= 6; i++) {
            document.getElementById(`e_stu${i}`).value = r[`stu${i}`] || '';
            document.getElementById(`e_class${i}`).value = r[`class${i}`] || '';
        }

        const awardSel = document.getElementById('e_award');
        if (awardOptions.includes(r.award)) {
            awardSel.value = r.award;
            document.getElementById('e_other_div').classList.add('d-none');
            document.getElementById('e_other_val').required = false;
            document.getElementById('e_other_val').value = '';
        } else {
            awardSel.value = '其他';
            document.getElementById('e_other_div').classList.remove('d-none');
            document.getElementById('e_other_val').required = true;
            document.getElementById('e_other_val').value = r.award || '';
        }
        editModal.show();
    };

    document.getElementById('editForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('e_id').value;
        const btn = document.getElementById('editSaveBtn');
        const awardVal = document.getElementById('e_award').value;
        const otherVal = document.getElementById('e_other_val').value.trim();
        const isOther = (awardVal === '其他' || awardVal.startsWith('其他'));
        const finalAward = isOther ? (otherVal || '獲獎') : awardVal;

        btn.disabled = true;
        btn.innerText = '儲存中...';
        try {
            await updateDoc(doc(db, "competition_records", id), {
                date: parseExcelDate(document.getElementById('e_date').value),
                inputDate: parseExcelDate(document.getElementById('e_input_date').value) || getLocalToday(),
                name: document.getElementById('e_name').value.trim(),
                cat: document.getElementById('e_cat').value,
                teacher: document.getElementById('e_teacher').value.trim(),
                award: finalAward,
                stu1: document.getElementById('e_stu1').value.trim(),
                class1: document.getElementById('e_class1').value.trim(),
                stu2: document.getElementById('e_stu2').value.trim(),
                class2: document.getElementById('e_class2').value.trim(),
                stu3: document.getElementById('e_stu3').value.trim(),
                class3: document.getElementById('e_class3').value.trim(),
                stu4: document.getElementById('e_stu4').value.trim(),
                class4: document.getElementById('e_class4').value.trim(),
                stu5: document.getElementById('e_stu5').value.trim(),
                class5: document.getElementById('e_class5').value.trim(),
                stu6: document.getElementById('e_stu6').value.trim(),
                class6: document.getElementById('e_class6').value.trim()
            });
            editModal.hide();
            doBackup("EDIT");
        } catch (err) {
            alert('更新失敗：' + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = '儲存變更';
        }
    });

    window.submitFeedback = async function() {
        const t = document.getElementById('feedbackIn').value.trim();
        if (!t) return;
        try {
            await addDoc(fbRef, { content: t, timestamp: serverTimestamp() });
            emailjs.send(EMAILJS_CONFIG.SERVICE_ID, EMAILJS_CONFIG.TEMPLATE_ID, {
                to_email: "lmw@lkfms.edu.hk",
                student_name: "留言板",
                comp_name: "系統建議",
                award_name: t,
                comp_date: getLocalToday()
            }).catch(() => {});
            alert("✅ 感謝意見！已轉達主任。");
            document.getElementById('feedbackIn').value = "";
        } catch (e) {}
    };

    window.triggerLogin = (r) => {
        switchLoginTarget(r);
        loginModal.show();
        setTimeout(() => document.getElementById('loginPwd').focus(), 400);
    };

    window.switchLoginTarget = (r) => {
        currentTargetRole = r;
        document.getElementById('btnStaffRole').className = `btn btn-sm ${r==='staff'?'btn-primary active':'btn-outline-primary'}`;
        document.getElementById('btnAdminRole').className = `btn btn-sm ${r==='admin'?'btn-danger active':'btn-outline-danger'}`;
        document.getElementById('loginPwd').value = '';
    };

    window.togglePasswordVisibility = () => {
        const pwdIn = document.getElementById('loginPwd');
        const icon = document.getElementById('pwdEyeIcon');
        if (pwdIn.type === 'password') {
            pwdIn.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            pwdIn.type = 'password';
            icon.className = 'bi bi-eye';
        }
    };

    window.confirmLogin = () => {
        const entered = document.getElementById('loginPwd').value.trim();
        if (btoa(entered) === PASS[currentTargetRole]) {
            currentRole = currentTargetRole;
            localStorage.setItem('lkfm_role', currentRole);
            loginModal.hide();
            applyRoleUI(currentRole);
            refreshUI();
        } else {
            alert("密碼錯誤，請重新輸入");
            document.getElementById('loginPwd').select();
        }
    };

    function applyRoleUI(r) {
        document.body.classList.remove('role-viewer', 'role-staff', 'role-admin');
        document.body.classList.add(`role-${r}`);
        const d = document.getElementById('roleDisplay');
        d.innerText = r === 'admin' ? '管理員 (Admin)' : (r === 'staff' ? '教職員 (Staff)' : '訪客模式');
        d.className = `role-badge text-white ${r === 'admin' ? 'bg-danger' : (r === 'staff' ? 'bg-primary' : 'bg-secondary')}`;
    }

    window.logout = () => {
        currentRole = 'viewer';
        localStorage.setItem('lkfm_role', 'viewer');
        applyRoleUI('viewer');
        refreshUI();
    };

    window.delRec = async (id) => {
        if(confirm("確定要刪除這筆獲獎紀錄？")) {
            await deleteDoc(doc(db, "competition_records", id));
            doBackup("DEL");
        }
    };

    window.fixLegacyDates = async () => {
        const serials = records.filter(r => isSerialDateVal(r.date));
        if (!serials.length) return;
        if (!confirm(`確認修復 ${serials.length} 筆舊日期序號為標準 YYYY-MM-DD 格式？`)) return;
        const b = writeBatch(db);
        serials.forEach(r => b.update(doc(db, "competition_records", r.id), { date: parseExcelDate(r.date) }));
        await b.commit();
        doBackup("FIX_DATES");
        alert(`✅ 成功修復 ${serials.length} 筆日期！`);
    };

    window.clearDb = async () => {
        if(confirm("⚠️ 警告：這將徹底清空雲端資料庫全部紀錄！")) {
            const ans = prompt("請輸入 CLEAR 確認：");
            if (ans === 'CLEAR') {
                const s = await getDocs(colRef);
                const b = writeBatch(db);
                s.docs.forEach(d => b.delete(d.ref));
                await b.commit();
                doBackup("CLEAR", []);
                alert("已清空。");
            }
        }
    };

    // --- 下載最新樣本 (支援 6 位學生) ---
    window.downloadTemplate = () => {
        const ws = XLSX.utils.json_to_sheet([
            {
                "日期":"2026-10-19",

                "類別":"音樂",
                "獎項":"冠軍",
                "負責老師":"周老師",
                "姓名1":"李誠熙",
                "班別1":"6A",
                "姓名2":"陳以諾",
                "班別2":"6A",
                "姓名3":"陳以琳",
                "班別3":"6B",
                "姓名4":"章嘉恆",
                "班別4":"5A",
                "姓名5":"賴曉瑜",

    };

    // --- 批量 Excel 匯入：使用 cellDates: false 避免時區偏移，支援逗號分隔 ---
    window.handleExcelImport = (input) => {
        const file = input.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = async (e) => {
            try {
                const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: false });
                const sheet = wb.Sheets[wb.SheetNames[0]];
                const rawRows = XLSX.utils.sheet_to_json(sheet, { raw: false, defval: '' });
                const rawVals = XLSX.utils.sheet_to_json(sheet, { raw: true, defval: '' });

                const entries = [];
                rawRows.forEach((row, idx) => {
                    const rv = rawVals[idx] || {};
                    const c = {};
                    const rc = {};
                    Object.keys(row).forEach(k => c[k.toString().trim().replace(/[\s\-_（）()]/g, '')] = row[k]);
                    Object.keys(rv).forEach(k => rc[k.toString().trim().replace(/[\s\-_（）()]/g, '')] = rv[k]);

                    const rawDate = rc["日期"] ?? rc["比賽日期"] ?? rc["活動日期"] ?? c["日期"] ?? c["比賽日期"] ?? "";
                    const validDate = parseExcelDate(rawDate);
                    const rawInputDate = rc["輸入日期"] ?? rc["填報日期"] ?? rc["inputdate"] ?? c["輸入日期"] ?? c["填報日期"] ?? "";
                    const validInputDate = parseExcelDate(rawInputDate) || getLocalToday();
                    const name = String(c["比賽名稱"] || c["活動名稱"] || c["比賽"] || "").trim();
                    if (!name && !validDate) return;

                    let stu1 = String(c["姓名1"] || c["學生1"] || c["姓名"] || c["學生"] || "").trim();
                    let class1 = String(c["班別1"] || c["班級1"] || c["班別"] || c["班級"] || "").trim();
                    let stu2 = String(c["姓名2"] || c["學生2"] || c["stu2"] || "").trim();
                    let class2 = String(c["班別2"] || c["班級2"] || c["class2"] || "").trim();
                    let stu3 = String(c["姓名3"] || c["學生3"] || c["stu3"] || "").trim();
                    let class3 = String(c["班別3"] || c["班級3"] || c["class3"] || "").trim();
                    let stu4 = String(c["姓名4"] || c["學生4"] || c["stu4"] || "").trim();
                    let class4 = String(c["班別4"] || c["班級4"] || c["class4"] || "").trim();
                    let stu5 = String(c["姓名5"] || c["學生5"] || c["stu5"] || "").trim();
                    let class5 = String(c["班別5"] || c["班級5"] || c["class5"] || "").trim();
                    let stu6 = String(c["姓名6"] || c["學生6"] || c["stu6"] || "").trim();
                    let class6 = String(c["班別6"] || c["班級6"] || c["class6"] || "").trim();

                    if (!stu2 && (stu1.includes(',') || stu1.includes('、'))) {
                        const sep = stu1.includes('、') ? '、' : ',';
                        const parts = stu1.split(sep).map(x => x.trim()).filter(Boolean);
                        const cParts = class1.split(sep).map(x => x.trim());
                        stu1 = parts[0] || ''; class1 = cParts[0] || class1;
                        if (parts[1]) { stu2 = parts[1]; class2 = cParts[1] || class1; }
                        if (parts[2]) { stu3 = parts[2]; class3 = cParts[2] || class1; }
                        if (parts[3]) { stu4 = parts[3]; class4 = cParts[3] || class1; }
                        if (parts[4]) { stu5 = parts[4]; class5 = cParts[4] || class1; }
                        if (parts[5]) { stu6 = parts[5]; class6 = cParts[5] || class1; }
                    }

                    entries.push({
                        date: validDate || "",
                        inputDate: validInputDate,
                        name,
                        stu1, class1,
                        stu2, class2,
                        stu3, class3,
                        stu4, class4,
                        stu5, class5,
                        stu6, class6,
                        teacher: String(c["負責老師"] || c["老師"] || "").trim(),
                        cat: String(c["類別"] || "學術").trim(),
                        award: String(c["獎項"] || c["名次"] || "").trim()
                    });
                });

                for (let i = 0; i < entries.length; i += 450) {
                    const chunk = entries.slice(i, i + 450);
                    const b = writeBatch(db);
                    chunk.forEach(item => b.set(doc(colRef), item));
                    await b.commit();
                }

                await doBackup("IMPORT");
                alert(`✅ 批量匯入成功！共匯入 ${entries.length} 筆資料，日期已自動校正為標準格式。`);
            } catch(err) {
                alert("匯入失敗：" + err.message);
            } finally {
                input.value = "";
            }
        };
        r.readAsArrayBuffer(file);
    };

    window.exportData = () => {
        const exported = records.map(r => ({
            "比賽日期": parseExcelDate(r.date),
            "輸入日期": r.inputDate ? parseExcelDate(r.inputDate) : "",
            "比賽名稱": r.name || "",
            "類別": r.cat || "",
            "獎項": r.award || "",
            "負責老師": r.teacher || "",
            "姓名1": r.stu1 || r.student || "",
            "班別1": r.class1 || r.class || "",
            "姓名2": r.stu2 || "",
            "班別2": r.class2 || "",
            "姓名3": r.stu3 || "",
            "班別3": r.class3 || "",
            "姓名4": r.stu4 || "",
            "班別4": r.class4 || "",
            "姓名5": r.stu5 || "",
            "班別5": r.class5 || "",
            "姓名6": r.stu6 || "",
            "班別6": r.class6 || ""
        }));
        const ws = XLSX.utils.json_to_sheet(exported);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Backup");
        XLSX.writeFile(wb, `盧光煇紀念學校_全校獲獎全表備份_${getLocalToday()}.xlsx`);
    };

    window.exportFilteredData = () => {
        const s = document.getElementById('searchInput').value.trim().toLowerCase();
        const c = document.getElementById('filterCat').value;
        const f = records.filter(r => {
            if (c !== "" && r.cat !== c) return false;
            if (selectedAward !== "") {
                if (selectedAward === "其他") {
                    if (awardOptions.includes(r.award)) return false;
                } else if (r.award !== selectedAward) {
                    return false;
                }
            }
            if (s !== "") {
                const combined = (
                    (r.stu1||"")+(r.class1||"")+(r.stu2||"")+(r.class2||"")+
                    (r.stu3||"")+(r.class3||"")+(r.stu4||"")+(r.class4||"")+
                    (r.stu5||"")+(r.class5||"")+(r.stu6||"")+(r.class6||"")+
                    (r.student||"")+(r.class||"")+(r.name||"")+(r.teacher||"")+(r.award||"")+
                    parseExcelDate(r.date)+(r.inputDate ? parseExcelDate(r.inputDate) : "")
                ).toLowerCase();
                if (!combined.includes(s)) return false;
            }
            return true;
        });

        const exported = f.map(r => ({
            "比賽日期": parseExcelDate(r.date),
            "輸入日期": r.inputDate ? parseExcelDate(r.inputDate) : "",
            "比賽名稱": r.name || "",
            "類別": r.cat || "",
            "獎項": r.award || "",
            "負責老師": r.teacher || "",
            "獲獎學生名單": [r.stu1, r.stu2, r.stu3, r.stu4, r.stu5, r.stu6].filter(Boolean).join(", ")
        }));
        const ws = XLSX.utils.json_to_sheet(exported);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Result");
        XLSX.writeFile(wb, `盧光煇紀念學校_獲獎統計報表_${getLocalToday()}.xlsx`);
    };

    window.checkOther = (s, d, inputId = 'f_other_val') => {
        const el = document.getElementById(d);
        if (!el) return;
        const isOther = (s.value === '其他' || s.value.startsWith('其他'));
        const inp = document.getElementById(inputId);
        if (isOther) {
            el.classList.remove('d-none');
            if (inp) {
                inp.required = true;
                setTimeout(() => inp.focus(), 60);
            }
        } else {
            el.classList.add('d-none');
            if (inp) {
                inp.required = false;
                inp.value = '';
            }
        }
    };

    applyRoleUI(currentRole);
</script>
